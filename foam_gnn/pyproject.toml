[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foam_gnn"
version = "0.1.0"
description = "Physics-informed GNN pipeline for quasi-2D evaporating soap-foam evolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Base dependencies: image -> graph stages (Modules 1-3). Pinned to versions
# verified in development. Torch / PyTorch-Geometric are an optional extra so the
# data pipeline installs without a deep-learning stack (see [project.optional-dependencies]).
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "opencv-python-headless==4.13.0.92",
    "matplotlib==3.10.9",
    "networkx==3.6.1",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
# Modules 4-6. On Colab, install torch/PyG from the CUDA-matched wheels instead
# (see requirements-colab.txt) — do NOT pin torch here, it is environment-specific.
ml = [
    "torch>=2.2",
    "torch_geometric>=2.5",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
